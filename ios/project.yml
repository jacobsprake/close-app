name: Close
options:
  bundleIdPrefix: com.close
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    PRODUCT_BUNDLE_IDENTIFIER: com.close.app
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Close:
    type: application
    platform: iOS
    sources:
      - path: Close
        excludes:
          - "Resources/Info.plist"
          - "Resources/PrivacyInfo.xcprivacy"
    resources:
      - path: Close/Resources/Assets.xcassets
      - path: Close/Resources/PrivacyInfo.xcprivacy
    info:
      path: Close/Resources/Info.plist
      properties:
        CFBundleDisplayName: Close
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: BrandBlue
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBluetoothAlwaysUsageDescription: Close uses Bluetooth to detect other Close users physically near you, so your profile only appears to people in the same room.
        NSBluetoothPeripheralUsageDescription: Close uses Bluetooth to advertise your presence to nearby Close users.
        NSLocationWhenInUseUsageDescription: Close uses your approximate location to power city hotspots and the city group chat. Your exact location is never shared.
        NSCameraUsageDescription: Close uses the camera to add profile photos.
        NSPhotoLibraryUsageDescription: Close uses your photo library to add profile photos.
        NSNearbyInteractionUsageDescription: Close uses Nearby Interaction (UWB) to confirm who is in the same room with you on supported devices.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
